<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُستكشف الرياضيات - سلطنة عمان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4338ca;
            --primary-light: #6366f1;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-grad: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #1e293b;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12), 0 0 0 4px rgba(255,255,255,0.8);
            padding: 25px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-top: 5px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .selector-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 16px;
            gap: 4px;
        }

        .btn-tab {
            border: none;
            background: transparent;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #64748b;
        }

        .btn-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 10px 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .problem-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
            margin-bottom: 20px;
            text-align: center;
        }

        .problem-title {
            font-size: 1.2rem;
            color: #334155;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .equation-box {
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 16px;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 900;
            color: #166534;
            margin-bottom: 15px;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            line-height: 1.8;
        }

        .blank-box {
            display: inline-block;
            min-width: 50px;
            height: 45px;
            line-height: 40px;
            border: 3px dashed var(--accent);
            background: #fffbeb;
            border-radius: 12px;
            color: #d97706;
            text-align: center;
            padding: 0 10px;
            animation: pulse 1.5s infinite;
        }

        .blank-box.filled {
            border-style: solid;
            border-color: var(--success);
            background: #dcfce7;
            color: #15803d;
            animation: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hint-text {
            font-size: 0.95rem;
            color: #0284c7;
            background: #e0f2fe;
            padding: 8px 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn-option {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #cbd5e1;
            direction: rtl;
        }

        .btn-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cbd5e1;
            border-color: var(--primary-light);
        }

        .btn-option:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #cbd5e1;
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
            box-shadow: 0 4px 0 #047857 !important;
        }

        .btn-option.wrong {
            background: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
            box-shadow: 0 4px 0 #b91c1c !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #312e81;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--primary-light);
        }

        .progress-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        .dot.completed {
            background: var(--success);
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .title {
                font-size: 1.5rem;
            }
            .equation-box {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="title">🇴🇲 مُستكشف الرياضيات الذكي</div>
        <div class="subtitle">منهج سلطنة عمان (الصف السادس والتاسع)</div>
    </div>

    <div class="controls">
        <div class="selector-group">
            <button class="btn-tab active" onclick="setGrade(6)">الصف السادس</button>
            <button class="btn-tab" onclick="setGrade(9)">الصف التاسع</button>
        </div>
        <div class="selector-group">
            <button class="btn-tab active" onclick="setTopic('prime')">الأعداد الأولية</button>
            <button class="btn-tab" onclick="setTopic('percent')">النسب المئوية</button>
            <button class="btn-tab" onclick="setTopic('scientific')">الصيغة العلمية</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">⭐ النقاط: <span id="score" class="stat-value">٠</span></div>
        <div class="progress-dots" id="dotsContainer"></div>
        <div class="stat-item">🔥 التتابع: <span id="streak" class="stat-value">٠</span></div>
    </div>

    <div class="problem-card">
        <div class="problem-title" id="problemTitle">جاري تحميل المسألة...</div>
        <div class="hint-text" id="hintText">اختر الرقم المناسب لإكمال الخطوة</div>
        <div class="equation-box" id="equationBox"></div>
        <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div class="nav-footer">
        <button class="btn-action" onclick="resetCurrentTopic()">إعادة الدرس 🔄</button>
        <button class="btn-action" onclick="nextQuestion()">المسألة التالية ➔</button>
    </div>
</div>

<script>
function toArabicDigits(str) {
    if (str === null || str === undefined) return '';
    return str.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

const dataset = {
    6: {
        prime: [
            {
                title: "تحليل العدد ١٢ إلى عوامله الأولية عبر شجرة العوامل",
                steps: [
                    { eq: "١٢ = ٤ × [ ؟ ]", answer: "٣", options: ["٢", "٣", "٤", "٥"], hint: "ما العدد الذي إذا ضربته في ٤ ينتج ١٢؟" },
                    { eq: "١٢ = (٢ × [ ؟ ]) × ٣", answer: "٢", options: ["٢", "٣", "٤", "٦"], hint: "فكّك العدد ٤ إلى حاصل ضرب عددين أولين" },
                    { eq: "العوامل الأولية للعدد ١٢ هي: ٢ × ٢ × ٣ = [ ؟ ]", answer: "١٢", options: ["١٠", "١٢", "١٤", "١٦"], hint: "تأكد من الناتج النهائي للضرب" }
                ]
            },
            {
                title: "تحديد أي الأعداد التالية عدد أولي",
                steps: [
                    { eq: "العدد ٩ عوامله هي ١، ٣، ٩ إذن هو عدد [ ؟ ]", answer: "غير أولي", options: ["أولي", "غير أولي", "زوجي أولي", "لا شيء"], hint: "له أكثر من عاملين" },
                    { eq: "العدد ١٣ عوامله فقط ١ و [ ؟ ]", answer: "١٣", options: ["٣", "٧", "١٣", "٢٦"], hint: "العدد الأولي يقبل القسمه على نفسه وعلى ١" },
                    { eq: "إذن العدد الأولي من بين (٩، ١٣) هو: [ ؟ ]", answer: "١٣", options: ["٩", "١٣", "كلاهما", "لا أحد"], hint: "اختر العدد الأولي الصحيح" }
                ]
            },
            {
                title: "تحليل العدد ١٨ إلى عوامله الأولية",
                steps: [
                    { eq: "١٨ = ٢ × [ ؟ ]", answer: "٩", options: ["٦", "٨", "٩", "١٢"], hint: "نصف العدد ١٨" },
                    { eq: "١٨ = ٢ × ([ ؟ ] × ٣)", answer: "٣", options: ["٢", "٣", "٤", "٦"], hint: "فكّك العدد ٩ إلى حاصل ضرب عددين أولين" },
                    { eq: "الصيغة النهائية لضرب العوامل هي: ٢ × [ ؟ ] × ٣", answer: "٣", options: ["٢", "٣", "٥", "٩"], hint: "أكمل الرقم الناقص من العوامل" }
                ]
            },
            {
                title: "إيجاد العوامل الأولية للعدد ٢٠",
                steps: [
                    { eq: "٢٠ = ٥ × [ ؟ ]", answer: "٤", options: ["٢", "٤", "٥", "١٠"], hint: "كم نضرب في ٥ لنحصل على ٢٠؟" },
                    { eq: "٢٠ = ٥ × ([ ؟ ] × ٢)", answer: "٢", options: ["٢", "٣", "٤", "٥"], hint: "حلل العدد ٤ لعوامله الأولية" },
                    { eq: "العدد ٢٠ = ٢ × ٢ × [ ؟ ]", answer: "٥", options: ["٣", "٤", "٥", "١٠"], hint: "العامل الأولي الأخير" }
                ]
            },
            {
                title: "تطبيق الأعداد الأولية أصغر من ١٠",
                steps: [
                    { eq: "الأعداد الأولية الأصغر من ١٠ هي: ٢، ٣، ٥، [ ؟ ]", answer: "٧", options: ["٦", "٧", "٨", "٩"], hint: "ما هو العدد الأولي الفردي قبل ١٠؟" },
                    { eq: "مجموع أحدث عددين أولين (٥ + ٧) = [ ؟ ]", answer: "١٢", options: ["١٠", "١١", "١٢", "١٣"], hint: "اجمع ٥ مع ٧" },
                    { eq: "ناتج قسمة ١٢ ÷ ٣ = [ ؟ ]", answer: "٤", options: ["٣", "٤", "٦", "٨"], hint: "قسمة بسيطة" }
                ]
            }
        ],
        percent: [
            {
                title: "حساب ٢٠% من مبلغ ٥٠ ريال عُماني",
                steps: [
                    { eq: "كتابة النسبة المئوية على صورة كسر: ٢٠% = [ ؟ ] / ١٠٠", answer: "٢٠", options: ["١٠", "٢٠", "٥٠", "١٠٠"], hint: "النسبة تعني من ١٠٠" },
                    { eq: "التبسيط: ٢٠ / ١٠٠ = ١ / [ ؟ ]", answer: "٥", options: ["٢", "٤", "٥", "١٠"], hint: "اقسم البسط والمقام على ٢٠" },
                    { eq: "الحساب: ٥٠ ÷ ٥ = [ ؟ ] ريال", answer: "١٠", options: ["٥", "١٠", "١٥", "٢٠"], hint: "اقسم المبلغ على ٥" }
                ]
            },
            {
                title: "تحويل الكسر الاعتيادي ٣/٤ إلى نسبة مئوية",
                steps: [
                    { eq: "لتحويل الكسر إلى نسبة مئوية نضرب في: [ ؟ ]", answer: "١٠٠", options: ["١٠", "٥٠", "١٠٠", "١٠٠٠"], hint: "نضرب في ١٠٠%" },
                    { eq: "(٣ × ١٠٠) ÷ ٤ = [ ؟ ] ÷ ٤", answer: "٣٠٠", options: ["١٥٠", "٢٠٠", "٣٠٠", "٤٠٠"], hint: "اضرب البسط أولاً" },
                    { eq: "٣٠٠ ÷ ٤ = [ ؟ ] %", answer: "٧٥", options: ["٢٥", "٥٠", "٧٥", "٨٠"], hint: "ثلاثة أرباع الـ ١٠٠" }
                ]
            },
            {
                title: "حساب قيمة خصم ٢٥% على قميص سعره ٤٠ ريال",
                steps: [
                    { eq: "النسبة ٢٥% تُكافئ الكسر الاعتيادي: ١ / [ ؟ ]", answer: "٤", options: ["٢", "٣", "٤", "٥"], hint: "الربع يساوي ٢٥%" },
                    { eq: "مقدار الخصم = ٤٠ ÷ ٤ = [ ؟ ] ريال", answer: "١٠", options: ["٥", "١٠", "١٥", "٢٠"], hint: "اقسم السعر الأصلي على ٤" },
                    { eq: "السعر الجديد بعد الخصم = ٤٠ - ١٠ = [ ؟ ] ريال", answer: "٣٠", options: ["٢٠", "٢٥", "٣٠", "٣٥"], hint: "اطرح الخصم من السعر الأصلي" }
                ]
            },
            {
                title: "حساب ٥٠% من العدد ٨٠",
                steps: [
                    { eq: "٥٠% تعني النصف، أي نقسم على: [ ؟ ]", answer: "٢", options: ["٢", "٤", "٥", "١٠"], hint: "النصف يعادل القسمة على كم؟" },
                    { eq: "٨٠ ÷ ٢ = [ ؟ ]", answer: "٤٠", options: ["٢٠", "٣٠", "٤٠", "٥٠"], hint: "نصف الـ ٨٠" },
                    { eq: "إذا أضفنا ١٠ للناتج نحصل على: [ ؟ ]", answer: "٥٠", options: ["٤٥", "٥٠", "٥٥", "٦٠"], hint: "٤٠ + ١٠" }
                ]
            },
            {
                title: "حساب ١٠% من سعر كتاب قيمته ٢٠٠ ريال",
                steps: [
                    { eq: "١٠% تعني القسمة على: [ ؟ ]", answer: "١٠", options: ["٢", "٥", "١٠", "١٠٠"], hint: "١٠ من ١٠٠" },
                    { eq: "مقدار الـ ١٠% = ٢٠٠ ÷ ١٠ = [ ؟ ] ريال", answer: "٢٠", options: ["١٠", "٢٠", "٣٠", "٤٠"], hint: "احذف صفراً من الـ ٢٠٠" },
                    { eq: "٢٠٠ - ٢٠ = [ ؟ ] ريال", answer: "١٨٠", options: ["١٦٠", "١٧٠", "١٨٠", "١٩٠"], hint: "السعر بعد التخفيض" }
                ]
            }
        ],
        scientific: [
            {
                title: "الضرب في قوى العدد ١٠ (إزاحة الفاصلة)",
                steps: [
                    { eq: "٤٫٥ × ١٠ = [ ؟ ]", answer: "٤٥", options: ["٠٫٤٥", "٤٥", "٤٥٠", "٤٥٠٠"], hint: "حرك الفاصلة خانة واحدة لليمين" },
                    { eq: "٤٫٥ × ١٠٠ = [ ؟ ]", answer: "٤٥٠", options: ["٤٥", "٤٥٠", "٤٥٠٠", "٤٥٠٠٠"], hint: "حرك الفاصلة خانتين لليمين" },
                    { eq: "٤٫٥ × ١٠³ = [ ؟ ]", answer: "٤٥٠٠", options: ["٤٥٠", "٤٥٠٠", "٤٥٠٠٠", "٤٥"], hint: "١٠³ تعني الضرب في ١٠٠٠" }
                ]
            },
            {
                title: "كتابة العدد ٥٠٠٠ باستخدام قوى ١٠",
                steps: [

                    { eq: "إذن ٥٠٠٠ = ٥ × ١٠^[ ؟ ]", answer: "٣", options: ["٢", "٣", "٤", "٥"], hint: "أكمل الصيغة" }
                ]
            },
            {
                title: "قسمة عدد عشري على قوى ١٠",
                steps: [
                    { eq: "٣٥٫٦ ÷ ١٠ = [ ؟ ]", answer: "٣٫٥٦", options: ["٠٫٣٥٦", "٣٫٥٦", "٣٥٫٦", "٣٥٦"], hint: "حرك الفاصلة خانة واحدة لليسار" },
                    { eq: "٣٥٫٦ ÷ ١٠٠ = [ ؟ ]", answer: "٠٫٣٥٦", options: ["٠٫٣٥٦", "٣٫٥٦", "٣٥٫٦", "٠٫٠٣٥٦"], hint: "حرك الفاصلة خانتين لليسار" },
                    { eq: "٣٫٥٦ × ١٠ = [ ؟ ]", answer: "٣٥٫٦", options: ["٣٫٥٦", "٣٥٫٦", "٣٥٦", "٠٫٣٥٦"], hint: "الضرب يعكس القسمة" }
                ]
            },
            {
                title: "التعرف على قوى العدد ١٠",
                steps: [
                    { eq: "١٠² = [ ؟ ]", answer: "١٠٠", options: ["١٠", "١٠٠", "١٠٠٠", "٢٠"], hint: "١٠ × ١٠" },
                    { eq: "١٠⁴ = [ ؟ ]", answer: "١٠٠٠٠", options: ["١٠٠٠", "١٠٠٠٠", "١٠٠٠٠٠", "٤٠"], hint: "واحد وأمامه ٤ أصفار" },
                    { eq: "١٠٠ × ١٠٠ = ١٠^[ ؟ ]", answer: "٤", options: ["٢", "٣", "٤", "٥"], hint: "اجمع الأُسس" }
                ]
            },
            {
                title: "تحليل العدد ٢٣٠٠ إلى صيغة ممتدة",
                steps: [

let currentGrade = 6;
let currentTopic = 'prime';
let currentQuestionIndex = 0;
let currentStepIndex = 0;
let score = 0;
let streak = 0;

function initGame() {
    renderDots();
    loadQuestion();
}

function setGrade(g) {
    currentGrade = g;
    currentQuestionIndex = 0;
    currentStepIndex = 0;
    document.querySelectorAll('.selector-group')[0].querySelectorAll('.btn-tab').forEach((btn, idx) => {
        btn.classList.toggle('active', (g === 6 && idx === 0) || (g === 9 && idx === 1));
    });
    renderDots();
    loadQuestion();
}

function setTopic(t) {
    currentTopic = t;
    currentQuestionIndex = 0;
    currentStepIndex = 0;
    const topicMap = { 'prime': 0, 'percent': 1, 'scientific': 2 };
    document.querySelectorAll('.selector-group')[1].querySelectorAll('.btn-tab').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === topicMap[t]);
    });
    renderDots();
    loadQuestion();
}

function renderDots() {
    const dotsContainer = document.getElementById('dotsContainer');
    dotsContainer.innerHTML = '';
    const total = dataset[currentGrade][currentTopic].length;
    for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = `dot ${i === currentQuestionIndex ? 'active' : ''} ${i < currentQuestionIndex ? 'completed' : ''}`;
        dotsContainer.appendChild(dot);
    }
}

function loadQuestion() {
    const questions = dataset[currentGrade][currentTopic];
    if (currentQuestionIndex >= questions.length) {
        currentQuestionIndex = 0; 
    }

    const q = questions[currentQuestionIndex];
    document.getElementById('problemTitle').innerText = `مسألة ${toArabicDigits(currentQuestionIndex + 1)} من ${toArabicDigits(questions.length)}: ${q.title}`;
    
    renderEquation();
    renderOptions();
    renderDots();
}

function renderEquation() {
    const q = dataset[currentGrade][currentTopic][currentQuestionIndex];
    const eqBox = document.getElementById('equationBox');
    eqBox.innerHTML = '';

    for (let i = 0; i <= currentStepIndex; i++) {
        const step = q.steps[i];
        const stepDiv = document.createElement('div');
        stepDiv.style.width = '100%';
        stepDiv.style.margin = '5px 0';

        if (i < currentStepIndex) {
            stepDiv.innerHTML = step.eq.replace('[ ؟ ]', `<span class="blank-box filled">${step.answer}</span>`);
        } else {
            stepDiv.innerHTML = step.eq.replace('[ ؟ ]', `<span class="blank-box">[ ؟ ]</span>`);
            document.getElementById('hintText').innerText = step.hint;
        }
        eqBox.appendChild(stepDiv);
    }
}

function renderOptions() {
    const q = dataset[currentGrade][currentTopic][currentQuestionIndex];
    const step = q.steps[currentStepIndex];
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';

    let options = [...step.options];
    options.sort(() => Math.random() - 0.5);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, step.answer, btn);
        grid.appendChild(btn);
    });
}

function checkAnswer(selected, correct, btn) {
    if (selected === correct) {
        btn.classList.add('correct');
        score += 10;
        streak += 1;
        document.getElementById('score').innerText = toArabicDigits(score);
        document.getElementById('streak').innerText = toArabicDigits(streak);

        const q = dataset[currentGrade][currentTopic][currentQuestionIndex];
        
        setTimeout(() => {
            if (currentStepIndex < q.steps.length - 1) {
                currentStepIndex++;
                renderEquation();
                renderOptions();
            } else {
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
                currentStepIndex = 0;
                currentQuestionIndex++;
                if (currentQuestionIndex >= q.steps.length) {
                    alert('🎉 ممتااااز! أكملت جميع مسائل هذا الدرس بنجاح!');
                }
                loadQuestion();
            }
        }, 600);

    } else {
        btn.classList.add('wrong');
        streak = 0;
        document.getElementById('streak').innerText = toArabicDigits(streak);
        setTimeout(() => btn.classList.remove('wrong'), 800);
    }
}

function nextQuestion() {
    currentStepIndex = 0;
    currentQuestionIndex++;
    loadQuestion();
}

function resetCurrentTopic() {
    currentQuestionIndex = 0;
    currentStepIndex = 0;
    score = 0;
    streak = 0;
    document.getElementById('score').innerText = toArabicDigits(score);
    document.getElementById('streak').innerText = toArabicDigits(streak);
    loadQuestion();
}

window.onload = initGame;
</script>
